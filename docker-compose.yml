services:
  server:
    build:
      context: ./server
    container_name: vara-server
    environment:
      PORT: "8080"
      DATA_DIR: /app/data
      STATIC_DIR: /app/dist
    ports:
      - "8080:8080"
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./server/data:/app/data
      - ./dist:/app/dist:ro
    restart: unless-stopped
